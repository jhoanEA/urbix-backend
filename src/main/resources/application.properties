spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/urbixdb?createDatabaseIfNotExist=true&serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysql}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
server.port=${PORT:8080}
urbix.admin.correo=${URBIX_ADMIN_CORREO:admin@urbix.pe}
urbix.admin.clave=${URBIX_ADMIN_CLAVE:admin123}
urbix.inspector.correo=${URBIX_INSPECTOR_CORREO:campo@urbix.pe}
urbix.inspector.clave=${URBIX_INSPECTOR_CLAVE:1234}