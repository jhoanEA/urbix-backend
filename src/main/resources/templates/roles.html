<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{fragments :: pagina('Roles', ~{::cuerpo})}">
<body>
<div th:fragment="cuerpo">
    <h1 class="urbix-titulo">Roles</h1>
    <p class="urbix-subtitulo">Perfiles que definen el acceso de cada usuario.</p>

    <div th:if="${error}" class="urbix-alerta urbix-alerta-error" th:text="${error}"></div>

    <div class="urbix-tarjeta">
        <form method="post" action="/roles/guardar" class="urbix-formulario">
            <div>
                <label for="nombre">Nombre del rol</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Inspector de Campo" required>
            </div>
            <div></div>
            <button type="submit" class="urbix-boton">Agregar</button>
        </form>
    </div>

    <div class="urbix-tarjeta">
        <h3>Roles registrados</h3>
        <table class="urbix-tabla">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Estado</th>
                <th style="width: 250px;">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${lista}">
                <td th:text="${r.nombreRol}"></td>
                <td>
                    <span class="urbix-etiqueta"
                          th:classappend="${r.activo} ? 'urbix-etiqueta-proceso' : 'urbix-etiqueta-reportada'"
                          th:text="${r.activo} ? 'Activo' : 'Inactivo'"></span>
                </td>
                <td>
                    <span class="urbix-acciones">
                        <form method="post" th:if="${r.activo}"
                              th:action="@{/roles/{id}/estado(id=${r.idRol})}">
                            <input type="hidden" name="activo" value="false">
                            <button class="urbix-mini">Desactivar</button>
                        </form>
                        <form method="post" th:unless="${r.activo}"
                              th:action="@{/roles/{id}/estado(id=${r.idRol})}">
                            <input type="hidden" name="activo" value="true">
                            <button class="urbix-mini">Activar</button>
                        </form>
                        <form method="post" th:action="@{/roles/{id}/eliminar(id=${r.idRol})}">
                            <button class="urbix-mini">Eliminar</button>
                        </form>
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
