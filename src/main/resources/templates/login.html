<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Urbix - Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/urbix.css}">
    <style>
        body { background: var(--urbix-verde); min-height: 100vh; }
        .urbix-login-envoltura {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px 70px;
            border-bottom: 3px dashed var(--urbix-naranja);
        }
        .urbix-login-titulo {
            color: #ffffff;
            font-size: 42px;
            font-weight: 700;
            margin: 0 0 6px;
            letter-spacing: 1px;
        }
        .urbix-login-bajada {
            color: #b9cfcd;
            font-size: 15px;
            margin: 0 0 30px;
        }
        .urbix-login-caja {
            background: #ffffff;
            border-radius: 10px;
            padding: 30px 32px;
            width: 100%;
            max-width: 400px;
            border-top: 3px solid var(--urbix-naranja);
        }
        .urbix-login-caja h2 {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 20px;
        }
        .urbix-login-caja .urbix-boton { width: 100%; margin-top: 18px; }
        .urbix-login-pie {
            color: #8fb0ad;
            font-size: 12.5px;
            margin-top: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="urbix-login-envoltura">
    <h1 class="urbix-login-titulo">Urbix</h1>
    <p class="urbix-login-bajada">Incidencias urbanas, de la calle a la solución.</p>

    <div class="urbix-login-caja">
        <h2>Iniciar sesión</h2>
        <div th:if="${error}" class="urbix-alerta urbix-alerta-error" th:text="${error}"></div>
        <form method="post" action="/login">
            <div style="margin-bottom: 14px;">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" autocomplete="username" required>
            </div>
            <div style="margin-bottom: 6px;">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave" autocomplete="current-password" required>
            </div>
            <button type="submit" class="urbix-boton">Entrar</button>
        </form>
        <p class="urbix-login-pie">Acceso inicial: admin@urbix.pe / admin123</p>
    </div>
</div>
</body>
</html>
