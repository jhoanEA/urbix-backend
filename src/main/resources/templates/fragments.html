<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="pagina(titulo, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">URBIX</title>
    <link rel="stylesheet" th:href="@{/css/urbix.css}">
    <script th:src="@{/js/urbix.js}" defer></script>
</head>
<body>
<nav class="urbix-navbar">
    <a class="urbix-marca" href="/panel">Urbix</a>
    <div class="urbix-menu">
        <a class="urbix-enlace" th:classappend="${titulo == 'Panel'} ? 'activo'"
           th:href="@{/panel}">Panel</a>
        <a class="urbix-enlace" th:classappend="${titulo == 'Incidencias'} ? 'activo'"
           th:href="@{/incidencias}">Incidencias</a>
        <a class="urbix-enlace" th:classappend="${titulo == 'Categorías'} ? 'activo'"
           th:href="@{/categorias}">Categorías</a>
        <a class="urbix-enlace" th:classappend="${titulo == 'Zonas'} ? 'activo'"
           th:href="@{/zonas}">Zonas</a>
        <a class="urbix-enlace" th:classappend="${titulo == 'Usuarios'} ? 'activo'"
           th:href="@{/usuarios}">Usuarios</a>
        <a class="urbix-enlace" th:classappend="${titulo == 'Roles'} ? 'activo'"
           th:href="@{/roles}">Roles</a>
    </div>
    <div class="urbix-usuario">
        <div>
            <strong th:text="${nombreUsuario}">Administrador</strong>
            <span th:text="${rolUsuario}">Supervisor / Admin</span>
        </div>
        <a class="urbix-boton-salir" th:href="@{/logout}">Cerrar sesión</a>
    </div>
</nav>
<div class="urbix-contenido" th:insert="${contenido}"></div>
<div th:replace="~{fragments-incidencia :: visor}"></div>
</body>
</html>
