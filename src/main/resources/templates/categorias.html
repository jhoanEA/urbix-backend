<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{fragments :: pagina('Categorías', ~{::cuerpo})}">
<body>
<div th:fragment="cuerpo">
    <h1 class="urbix-titulo">Categorías</h1>
    <p class="urbix-subtitulo">Tipos de avería que la app descarga como catálogo.</p>

    <div th:if="${error}" class="urbix-alerta urbix-alerta-error" th:text="${error}"></div>

    <div class="urbix-tarjeta">
        <form method="post" action="/categorias/guardar" class="urbix-formulario">
            <div>
                <label for="nombre">Nombre de la avería</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Alumbrado Público" required>
            </div>
            <div></div>
            <button type="submit" class="urbix-boton">Agregar</button>
        </form>
    </div>

    <div class="urbix-tarjeta">
        <h3>Categorías registradas</h3>
        <table class="urbix-tabla">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Estado</th>
                <th style="width: 250px;">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${lista}">
                <td th:text="${c.nombreCategoria}"></td>
                <td>
                    <span class="urbix-etiqueta"
                          th:classappend="${c.activo} ? 'urbix-etiqueta-proceso' : 'urbix-etiqueta-reportada'"
                          th:text="${c.activo} ? 'Activo' : 'Inactivo'"></span>
                </td>
                <td>
                    <span class="urbix-acciones">
                        <form method="post" th:if="${c.activo}"
                              th:action="@{/categorias/{id}/estado(id=${c.idCategoria})}">
                            <input type="hidden" name="activo" value="false">
                            <button class="urbix-mini">Desactivar</button>
                        </form>
                        <form method="post" th:unless="${c.activo}"
                              th:action="@{/categorias/{id}/estado(id=${c.idCategoria})}">
                            <input type="hidden" name="activo" value="true">
                            <button class="urbix-mini">Activar</button>
                        </form>
                        <form method="post" th:action="@{/categorias/{id}/eliminar(id=${c.idCategoria})}">
                            <button class="urbix-mini">Eliminar</button>
                        </form>
                    </span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(lista)}">
                <td colspan="3" class="urbix-vacio">No hay categorías registradas.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
