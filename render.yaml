services:
  - type: web
    name: urbix-backend
    env: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx256m -Xms128m -XX:+UseSerialGC -Dspring.main.lazy-initialization=true
